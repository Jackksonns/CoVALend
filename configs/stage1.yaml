# Stage 1 Training Configuration
# Warm-up training for CoVALend model

model:
  base_model_name: "meta-llama/Llama-2-7b-hf"
  use_finance_encoder: true
  use_scsa: true
  
  # Finance Encoder settings
  structured_numeric_features:
    - "income"
    - "overdue_count"
    - "credit_score"
    - "debt_ratio"
  
  structured_categorical_features:
    job_type: 10
    education: 5
    marital_status: 4
  
  structured_embed_dim: 512
  structured_cat_embed_dim: 100
  
  # SCSA settings
  scsa_window_size: 7
  scsa_kernel_sizes: [3, 5, 7, 9]
  scsa_gate_layer: "sigmoid"
  scsa_attn_drop_ratio: 0.1

training:
  # Basic training settings
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 8
  effective_batch_size: 32  # batch_size * gradient_accumulation_steps
  
  # Optimization
  learning_rate: 2.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  
  # Learning rate schedule
  lr_scheduler_type: "cosine"
  
  # Mixed precision training
  fp16: true
  bf16: false
  
  # Logging and saving
  logging_steps: 10
  eval_steps: 100
  save_steps: 500
  save_total_limit: 3
  
  # Data settings
  max_seq_length: 512
  preprocessing_num_workers: 4

lora:
  # LoRA configuration
  use_lora: true
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  train_file: "data/processed/train_stage1.json"
  validation_file: "data/processed/val_stage1.json"
  test_file: "data/processed/test_stage1.json"

output:
  output_dir: "outputs/stage1"
  overwrite_output_dir: true
  run_name: "covalend_stage1"

evaluation:
  # Evaluation metrics
  compute_fairness: true
  fairness_group_key: "group"
  
  # Metric thresholds
  min_f1: 0.5
  min_accuracy: 0.6

reproducibility:
  seed: 42
  deterministic: true
